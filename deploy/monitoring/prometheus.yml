global:
  scrape_interval: 30s
scrape_configs:
  - job_name: caau-api
    metrics_path: /api/v1/observability/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitoring_token
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: caau-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://host.docker.internal:3000/api/v1/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: notifier
    static_configs:
      - targets: ['notifier:9098']
