apiVersion: 1
groups:
  - orgId: 1
    name: CAAU platform
    folder: CAAU
    interval: 30s
    rules:
      - uid: api-down
        title: CAAU API或数据库持续不可用
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU API或数据库持续不可用
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 1-min(probe_success{job="caau-health"}) or
                absent(probe_success{job="caau-health"})
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: scrape-down
        title: CAAU 运行指标采集中断
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 运行指标采集中断
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 1-min(up{job="caau-api"}) or absent(up{job="caau-api"})
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: api-errors
        title: CAAU API错误率升高
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU API错误率升高
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (sum(increase(caau_http_errors_total[5m])) >= bool 5) *
                (sum(rate(caau_http_errors_total[5m])) /
                clamp_min(sum(rate(caau_http_requests_total[5m])),0.001) > bool
                0.05)
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: model-failures
        title: CAAU 模型失败率升高
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 模型失败率升高
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr:
                (sum(increase(caau_model_calls_total{mode="QWEN",result="FAILED"}[10m]))
                >= bool 3)
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: disk-warning
        title: CAAU 磁盘容量预警
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 磁盘容量预警
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: caau_disk_used_ratio > bool 0.8
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: disk-critical
        title: CAAU 磁盘容量严重不足
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 磁盘容量严重不足
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: caau_disk_used_ratio > bool 0.9
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: notify-failure
        title: CAAU 飞书通知未配置或发送失败
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 飞书通知未配置或发送失败
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (1-caau_notifier_configured) or
                (increase(caau_notifier_failures_total[5m]) > bool 0)
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: audit-failure
        title: CAAU 审计写入失败
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 审计写入失败
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: increase(caau_audit_failures_total[1m]) > bool 0
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
      - uid: backup-failure
        title: CAAU 数据库备份失败或超过24小时未完成
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: CAAU 数据库备份失败或超过24小时未完成
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: caau-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (1-caau_backup_success) + (time()-caau_backup_timestamp_seconds > bool 86400)
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              expression: $A > 0
              refId: B
contactPoints:
  - orgId: 1
    name: caau-feishu
    receivers:
      - uid: caau-notifier
        type: webhook
        settings:
          url: http://notifier:9098/alerts
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $CAAU_ALERT_TOKEN
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: caau-feishu
    group_by:
      - alertname
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 30m
