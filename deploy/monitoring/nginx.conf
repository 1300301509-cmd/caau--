server {
  listen 80;
  location = /_caau_auth {
    internal;
    proxy_pass http://host.docker.internal:3000/api/v1/observability/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-WEBAUTH-USER "";
  }
  location /ops/grafana/ {
    auth_request /_caau_auth;
    auth_request_set $actor $upstream_http_x_webauth_user;
    proxy_set_header X-WEBAUTH-USER $actor;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host $http_host;
    proxy_pass http://grafana:3000;
  }
  location / { return 404; }
}
