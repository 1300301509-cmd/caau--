packages:
  - apps/*
  - packages/*
  - database

# esbuild verifies/selects its platform binary during installation.
onlyBuiltDependencies:
  - esbuild
  # Downloads the schema engine for the exact pinned Prisma engine version.
  - '@prisma/engines'
# Nest's postinstall only prints its donation message; no build is required.
ignoredBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf' # Swagger dependency's optional install analytics
  - prisma # Runtime engines are enforced by package.json; no preinstall required
  # Prebuilt platform packages are locked; no local native compilation/fallback install.
  - '@parcel/watcher'
  - '@swc/core'
  - '@tarojs/binding'
  # CLI postinstall would add a global, floating performance-report plugin.
  - '@tarojs/cli'
  - core-js
  - core-js-pure
# Frontend frameworks must resolve peers in their own application, not the root.
resolvePeersFromWorkspaceRoot: false

# Keep checkpoint and database pools on the project's pinned pg type contract.
overrides:
  '@types/pg': 8.23.1

# LangGraph API 1.5.0 requires node-server 2; node-ws retains a v1 peer range.
# Limit the exception to this existing Studio dependency, not application peers.
peerDependencyRules:
  allowedVersions:
    '@hono/node-ws>@hono/node-server': 2.1.1
