name: Engineering checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: caau-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Verify package manager and install locked dependencies
        run: |
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile
      - name: Static checks, offline migration SQL and generated contract drift
        run: corepack pnpm check
      - name: Build all three applications
        run: corepack pnpm build
      - name: Application and HTTP integration tests
        run: corepack pnpm test
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Built Web to live API browser tests
        run: corepack pnpm test:e2e
      - name: Verify tracked files were not rewritten
        run: git diff --exit-code

  database:
    needs: engineering
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile
      - name: Create ephemeral runner-only database credentials
        run: corepack pnpm db:setup
      - name: Validate actual Compose configuration
        run: docker compose -f deploy/compose.database.yml --profile test config --quiet
      - name: PostgreSQL connection, outage, recovery and isolated migrations
        run: corepack pnpm db:test
      - name: Confirm no tracked schema or credential drift
        run: git diff --exit-code
      - name: Stop test service only
        if: always()
        run: docker compose -f deploy/compose.database.yml stop postgres-test
